name: CulebrIA Fútbol

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  football:
    name: CulebrIA Fútbol
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_KEY: ${{ secrets.FOOTBALL_DATA_ORG_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PYTHONUTF8: "1"

    steps:
      - name: Descargar CulebrIA
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Limpiar decisiones anteriores
        shell: bash
        run: |
          rm -f data/culebria_operational_final.json
          rm -f data/culebria_bet_confirmation.json
          rm -f culebria-football.log
          rm -f culebria-confirmation.log

      - name: Ejecutar CulebrIA fútbol
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 culebria.py 2>&1 | tee culebria-football.log

      - name: Confirmación fresca fútbol
        shell: bash
        run: |
          set -o pipefail
          python -X utf8 confirm_culebria_bet.py 2>&1 | tee culebria-confirmation.log

      - name: Resultado CulebrIA
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python -X utf8 render_culebria_summary.py
